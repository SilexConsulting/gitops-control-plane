name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: SilexConsulting/.github/.github/workflows/gitops-ci.yml@e1d69d56c1e82ea06b33ace7731ed81d800e9939 # main
    with:
      kubernetes: true
      kustomize_exclude: "bootstrap/argocd"   # sops/ksops build — needs the age key, skip in CI
      terraform: true
      terraform_dirs: "terraform/on-prem terraform/hub-spoke/hub terraform/hub-spoke/spokes"
