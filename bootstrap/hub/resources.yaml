# nonk8s
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: resources
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    # Master switch: only clusters labelled enable_resources=true get the resources layer.
    - clusters:
        selector:
          matchExpressions:
            - key: enable_resources
              operator: In
              values: ["true"]
  template:
    metadata:
      name: cluster-{{.name}}-resources
    spec:
      project: default
      # Global, cluster-wide resources with NO addon/workload owner (e.g. IngressClass,
      # StorageClass). GIT-20 convention: these live in the addons repo's `resources/` tree
      # (gitops-addons/environments/<scope>/resources). Three kustomize scopes, layered
      # least→most specific (default → env → cluster); a manifest applies only if listed in
      # that scope's root kustomization.yaml.
      sources:
        - repoURL: '{{.metadata.annotations.addons_repo_url}}'
          targetRevision: '{{.metadata.annotations.addons_repo_revision}}'
          path: environments/default/resources
          kustomize: {}
        - repoURL: '{{.metadata.annotations.addons_repo_url}}'
          targetRevision: '{{.metadata.annotations.addons_repo_revision}}'
          path: 'environments/{{.metadata.labels.env}}/resources'
          kustomize: {}
        - repoURL: '{{.metadata.annotations.addons_repo_url}}'
          targetRevision: '{{.metadata.annotations.addons_repo_revision}}'
          path: 'clusters/{{.metadata.labels.cluster_name}}/resources'
          kustomize: {}
      destination:
        server: '{{.server}}'
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # CRD instances can be large.
