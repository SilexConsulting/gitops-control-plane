# nonk8s
# Example structure of bootstrap/argocd/secrets.enc.yaml (the real, SOPS-encrypted file).
#
# Only PRIVATE repositories need an Argo CD repository Secret. The public catalogues
# (gitops-addons, gitops-workloads) are fetched anonymously over HTTPS — do NOT add Secrets for
# them: an SSH URL + a deploy key for another repo shows as "Failed" in Argo's repo list.
#
# This file is intended to be encrypted with SOPS:
#     sops -e bootstrap/argocd/secrets.yaml > bootstrap/argocd/secrets.enc.yaml
# and applied (no in-cluster SOPS) with:
#     make argocd-bootstrap CONTEXT=<kubectl-context>
---
# GIT-13 private deployments repo. Required for deployments mode (gitops_*_private_repo set).
# `url` must match the cluster annotation EXACTLY (`<gitops_private_org>/<repo>`, no `.git`).
# Use a read-only GitHub deploy key on SilexConsulting/gitops-private.
apiVersion: v1
kind: Secret
metadata:
  name: repo-gitops-private
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  name: gitops-private
  type: git
  url: git@github.com:SilexConsulting/gitops-private
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    -----END OPENSSH PRIVATE KEY-----
