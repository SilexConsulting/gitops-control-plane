# NOTE:
# - This file is intended to be encrypted with SOPS. Run:
#     sops -e -i bootstrap/argocd/secrets.yaml
# - If you do not have in-cluster SOPS decryption, apply the decrypted secret once:
#     sops -d bootstrap/argocd/secrets.enc.yaml | kubectl apply -f -
---
# GIT-13 private deployments repo. Required for deployments mode (gitops_*_private_repo set).
# `url` must match the cluster annotation EXACTLY (`<gitops_private_org>/<repo>`, no `.git`).
# Use a read-only GitHub deploy key on SilexConsulting/gitops-private.
apiVersion: v1
kind: Secret
metadata:
  name: repo-gitops-private
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  name: gitops-private
  type: git
  url: git@github.com:SilexConsulting/gitops-private
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    -----END OPENSSH PRIVATE KEY-----
