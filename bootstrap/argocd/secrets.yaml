    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  name: gitops-addons
  type: git
  url: https://github.com/SilexConsulting/gitops-addons.git
